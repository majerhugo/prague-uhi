# Hodinový cyklus: cron-job.org volá GitHub API (workflow_dispatch na vetve main), lebo vlastné
# plánovanie GitHubu (schedule) sa v tomto repozitári nespúšťalo spoľahlivo:
#   :47 - stiahne snímku Netatmo (merania končia pri termíne ČHMÚ :50)
#   :05 - fetch=false, len doplní referenciu ČHMÚ a prebuduje web
#         (ČHMÚ okolo :01 zverejní dáta do :50 predchádzajúcej hodiny)
# Dá sa spustiť aj ručne z karty Actions.
#
# Dáta: vetva `data` (archív, len pribúdajú commity, jeden súbor na hodinu).
# Web: vetva `gh-pages` (index.html + dáta pre web, jediný commit, force push).
# Na skúšky v iných vetvách nastav vstupy data_branch a pages_branch - ostré vetvy sa nedotkne.
#
# Potrebné Secrets: NETATMO_CLIENT_ID, NETATMO_CLIENT_SECRET, NETATMO_REFRESH_TOKEN,
# SECRETS_PAT (fine-grained token s oprávnením "Secrets: Read and write" len pre tento repozitár).

name: Update map

on:
  workflow_dispatch:
    inputs:
      fetch:
        description: "Stiahnuť novú snímku Netatmo (inak len prepočítať web)"
        type: boolean
        default: true
      data_branch:
        description: "Vetva s archívom (na skúšky použi inú než data)"
        type: string
        default: data
      pages_branch:
        description: "Vetva s webom (na skúšky použi inú než gh-pages)"
        type: string
        default: gh-pages

permissions:
  contents: write

concurrency:
  group: update-map
  cancel-in-progress: false

env:
  REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
  DATA_BRANCH: ${{ github.event.inputs.data_branch || 'data' }}
  PAGES_BRANCH: ${{ github.event.inputs.pages_branch || 'gh-pages' }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Beh z inej vetvy než main smie písať len do skúšobných vetiev (vstupy data_branch a pages_branch).
      - name: Guard against writing to production branches
        if: github.ref_name != 'main' && (env.DATA_BRANCH == 'data' || env.PAGES_BRANCH == 'gh-pages')
        run: |
          echo "::error::Beh z vetvy $GITHUB_REF_NAME musí mať data_branch a pages_branch nastavené na skúšobné vetvy (nie data a gh-pages)."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore archive
        id: restore
        run: bash scripts/pull_data.sh

      - name: Fetch data and build site files
        env:
          NETATMO_CLIENT_ID: ${{ secrets.NETATMO_CLIENT_ID }}
          NETATMO_CLIENT_SECRET: ${{ secrets.NETATMO_CLIENT_SECRET }}
          NETATMO_REFRESH_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
        run: python fetch.py ${{ github.event.inputs.fetch == 'false' && '--no-fetch' || '' }}

      # Netatmo môže pri obnove vydať nový refresh token a starý zneplatniť.
      # Nový sa preto uloží späť do Secrets (beží aj vtedy, keď predošlý krok zlyhal).
      - name: Save rotated refresh token
        if: always()
        env:
          GH_TOKEN: ${{ secrets.SECRETS_PAT }}
          OLD_TOKEN: ${{ secrets.NETATMO_REFRESH_TOKEN }}
        run: |
          if [ -f token.json ]; then
            NEW_TOKEN=$(python -c "import json; print(json.load(open('token.json'))['refresh_token'])")
            echo "::add-mask::$NEW_TOKEN"
            if [ "$NEW_TOKEN" != "$OLD_TOKEN" ]; then
              gh secret set NETATMO_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" --body "$NEW_TOKEN"
              echo "Refresh token sa zmenil a bol uložený."
            fi
          fi

      # Archív sa uloží aj vtedy, keď po stiahnutí snímky zlyhal niektorý z ďalších krokov.
      - name: Save archive
        if: always() && steps.restore.outcome == 'success'
        run: bash scripts/push_data.sh

      - name: Publish site
        if: success()
        run: bash scripts/publish_site.sh
